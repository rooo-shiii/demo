<!DOCTYPE html>
<html>
    <head>
        <title>Access by Tag Name Example</title>
    </head>
    <body>
        <h2>Heading</h2>
        <p>Paragraph 1</p>
        <p>Paragraph 2</p>
        <p>Paragraph 3</p>

       
       <button onclick="changeColor()">Change Color</button>
        <script>
           function changeColor(){
            //get all <p> elements
                let paragraphs = document.getElementsByTagName("p");

                //access each paragraph directly by index
                paragraphs[0].style.color = "blue";
                   paragraphs[1].style.color = "Orange";
                      paragraphs[2].style.color = "Purple";
                              

                }
           
            </script>

    </body>
</html>
