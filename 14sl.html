<!DOCTYPE html>
<html>
    <head>
        <title>pattern print</title>
        <script>
            let count = 1;
        for (let i = 1; i <=5; i++) 
        {
            for (let j =1; j <= i; j++)
             {
              document.write(count +" ");
              count ++;
            }
           document.write("<br>");
        }
    </script>
    </head>

    </body>
