<!--Write a js program to print largest and smallest among 10 elements of an array -->
<!DOCTYPE html>
<html>
<head>
    <title>Largest Element and Smallest using map()</title>
</head>
<body>
    <script>
        let numbers = [];

        //take 10 inputs from user
        for (let i = 0; i < 10; i++) {
            let num = parseInt(prompt("Enter number " + (i + 1) + ":"));
            numbers.push(num);
        }

       //find largest and smallest using math methods
       let largest= Math.max(...numbers);//spread operators
       let smallest = Math.min(...numbers);



//display results
        document.write("Array:"+numbers.join(",")+"<br>");
        document.write("Largest element is: " + largest + "<br>");
         document.write("Smallest element is: " + smallest);
    </script>
</body>
</html>
