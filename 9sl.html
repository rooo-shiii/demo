<!DOCTYPE html>
<head>
    <title>Product Of Two Number</title>
     <style>
        #result {
            color: blue;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Enter Two Numbers:</h1>
    Enter First Number:
    <input type="number" id="num1"><br><br>
    Enter Second Number:
    <input type="number" id="num2"><br><br>
    <button onclick="findproduct()">Calculate</button>
    <p id="result"></p>
        <script>
            const findproduct=()=>{
                let a=parseInt(document.getElementById("num1").value);
                let b=parseInt(document.getElementById("num2").value);
                let product=a*b;
                document.getElementById("result").innerHTML="The product of " + a + " and " + b + " is :" +product;
            }
        </script>
</body>
