<!DOCTYPE html>
<html>
    <head>
        <title>Factorial of given number using Arrow Function</title>
        <script>
            //arrow function to calculate factorial
            const factorial = n => {
              let result=1;
              for(let i =1; i<=n; i++) {
                result *=i;
              }
                return result;
              };

              let num= parseInt(prompt("Enter a number:"));

              //check is the input is null or not a number NaN =not a number
              if(num== null || isNaN(num))
              {
                alert("Please enter a valid number!");
              }
              else{
                if(  num < 0){
                    alert("Factorial is not defined for negative numbers!");
                }
                else{
                    alert("Factorial of " + num + " is: " +factorial(num));
                }
              }

        </script>
    </head>
    <body>
    </body>
</html>
