<!DOCTYPE html>
<html>
    <head>
       <body>
    <h1>JavaScript Arrays</h1>
    <h2>The Splice() method</h2>

    <p>The splice() method adds new element to an array, and returns an array with the deleted elements(if any):</p>

    <p id ="demo1"></p>
       <p id ="demo2"></p>
          <p id ="demo3"></p>

    <script>
        const fruits = ["Banana", "Orange", "Apple", "Mango", "Strawberry"];
        document.getElementById("demo1").innerHTML="Original Array:<br> "+ fruits;
      
        let removed = fruits.splice(2,1, "Lemon", "kiwi");
        document.getElementById("demo2").innerHTML = "New Array:<br>" + fruits;
        document.getElementById("demo3").innerHTML = "Removed Items:<br>" + removed;
       

        </script>
    </body>
    </html>
