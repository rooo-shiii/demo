<!DOCTYPE html>
<html>
    <head>
        <title>Product of two numbers using Arrow Function</title>
        <script>
            //arrow function to calculate product
            const product = (a, b) => a * b;

            let num1 = parseFloat(prompt("Enter first number:"));
             let num2 = parseFloat(prompt("Enter second number:"));

             let result = product(num1, num2);

             alert("The product of " + num1 + " and" + num2 + " is :" + result);
             document.write("The product is :" + result);
           
        </script>
    </head>
    <body>
    </body>
</html>
