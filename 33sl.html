<!DOCTYPE html>
<head>
    <title>Background Color Change</title>
</head>
<body>
    <h2>Choose Background Color:</h2>
    <form>
    <input type="radio" name="color" value="black" onclick="changecolor(this.value)">Black<br>
    <input type="radio" name="color" value="red" onclick="changecolor(this.value)">Red<br>
    <input type="radio" name="color" value="green" onclick="changecolor(this.value)">Green<br>
    </form>
    <script>
        function changecolor(design){
            document.body.style.backgroundColor=design;
        }
    </script>
</body>
