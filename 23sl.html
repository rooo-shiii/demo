<!DOCTYPE html>
<html>
    <head>
        <title>Sum of Array Using ForEach</title>
    </head>
    <body>
        <script>
            let numbers=[5,10,15];
            let sum=0;
            numbers.forEach(num => {
                sum+=num;
            });
            document.write("Input Array:"+numbers+"<br>");
            document.write("Sum of numbers:"+sum);
        </script>
    </body>
</html>
