<!--Write a js program to print largest and smallest among 10 elements of an array -->
<!DOCTYPE html>
<html>
<head>
    <title>Largest Element and Smallest element using array</title>
</head>
<body>
    <script>
        let numbers = [];

        //take 10 inputs from user
        for (let i = 0; i < 10; i++) {
            let num = parseInt(prompt("Enter number " + (i + 1) + ":"));
            numbers.push(num);
        }

        //initialize largest and smallest
        let largest = numbers[0];
        let smallest = numbers[0];

//loop to find largest and smallest 
for(let i=1; i<numbers.length;i++){
    if(numbers[i]>largest){
        largest = numbers[i];
    }
    if(numbers[i]<smallest)
    {
        smallest =numbers[i]
    }
}

//display results
        document.write("Array:"+numbers.join(",")+"<br>");
        document.write("Largest element is: " + largest + "<br>");
         document.write("Smallest element is: " + smallest);
    </script>
</body>
</html>
