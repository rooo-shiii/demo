<!DOCTYPE html>
<html>
    <body>
        <h1>JavaScript Arrays</h1>
        <h2>The Slice() Method</h2>
        <p>When the slice() method is given two arguments, it selects array elements
            from the start argument, and up to (but not included) the end arguments:
        </p>
        <p id="demo"></p>
        <script>
            const fruits=["Banana","Apple","Kiwi","Lemon","Mango"];
            const citrus=fruits.slice(1,3);
            document.getElementById("demo").innerHTML=fruits+"<br><br>"+citrus;
        </script>
    </body>
</html>
