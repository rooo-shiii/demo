<!DOCTYPE html>
<html>
    <head>
        <title>Change font size and Text Color</title>
    </head>
    <body>
        <h2> Choose Paragraph Style </h2>

        <!--font size Selection-->
        <form>
            <strong>Font Size:</strong><br>
            <input type="radio" name="fontsize" value="12px" onclick="changeFontSize(this.value)">Small<br>
            <input type="radio" name="fontsize" value="16px" onclick="changeFontSize(this.value)">Medium<br>
            <input type="radio" name="fontsize" value="20px" onclick="changeFontSize(this.value)">Large<br><br>

            <!--Text Color Selection-->
            <strong>Text Color:</strong><br>
             <input type="radio" name="textcolor" value="red" onclick="changeTextColor(this.value)">Red<br>
              <input type="radio" name="textcolor" value="green" onclick="changeTextColor(this.value)">Green<br>
               <input type="radio" name="textcolor" value="blue" onclick="changeTextColor(this.value)">Blue<br>

        </form>

        <p id="myParagraph">This is a sample paragraph. Change my font size!</p>
        <script>
            
    function changeFontSize(size){
        document.getElementById("myParagraph").style.fontSize = size;
    }

    function changeTextColor(color){
        document.getElementById("myParagraph").style.color = color;
    }

            </script>

    </body>
</html>
