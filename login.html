```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f4c81,#4a90e2);
}

.container{
    width:400px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#0f4c81;
    font-size:28px;
}

.logo p{
    color:#777;
    margin-top:5px;
}

.role-select{
    margin-bottom:20px;
}

.role-select label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

.role-select select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-group input:focus,
.role-select select:focus{
    outline:none;
    border-color:#0f4c81;
}

.options{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    font-size:14px;
}

.options a{
    text-decoration:none;
    color:#0f4c81;
}

button{
    width:100%;
    padding:13px;
    background:#0f4c81;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#083b66;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#666;
    font-size:14px;
}
</style>

</head>
<body>

<div class="container">

    <div class="logo">
        <h1>Student Management System</h1>
        <p>Login to Continue</p>
    </div>

    <form action="login.php" method="POST">

        <div class="role-select">
            <label>User Role</label>
            <select name="role" required>
                <option value="">-- Select Role --</option>
                <option value="admin">👨‍💼 Admin</option>
                <option value="teacher">👨‍🏫 Teacher</option>
                <option value="student">👨‍🎓 Student</option>
            </select>
        </div>

        <div class="input-group">
            <label>Username / Email</label>
            <input type="text" name="username" placeholder="Enter username or email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>

        <div class="options">
            <label>
                <input type="checkbox"> Remember Me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>

    </form>

    <div class="footer">
        © 2026 Student Management System
    </div>

</div>

</body>
</html>
