<!DOCTYPE html>
<html>
    <head>
        <title>Power of a numbers</title>
                <script>
                    //get base and exponent from user
                    let base = prompt("Enter the base number:");
                    let exponent = prompt("Enter the exponent:");

                    //convert strings to numbers
                base = parseFloat(base);
                exponent = parseFloat(exponent);

                //calculate power
                let result = Math.pow(base, exponent);

                //display the result
                alert(base + "raised to the power of" + exponent + "is: "+result);
                </script>
                   </head>
            <body>
            </body>
            </html>
