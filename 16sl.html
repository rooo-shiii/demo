<!DOCTYPE html>
<html>
    <head>
       <body>
    <h1>JavaScript Arrays</h1>
    <h2>The length property</h2>
    <h2>The toString method</h2>

     <p>The length property returns the length of an array:</p>
     <p id ="demo1"></p>
    <p>The toString() method returns the elements of an array as a comma separated string:</p>
    <p id ="demo2"></p>

    <script>
        const fruits = [ "Banana", "Organge", "Apple", "Mango", "Strawberry"];
         let size= fruits.length;
        document.getElementById("demo1").innerHTML = size;
         let mylist = fruits.toString();
        document.getElementById("demo2").innerHTML = mylist;

        </script>
    </body>
    </html>
