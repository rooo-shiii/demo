<!DOCTYPE html>
<html>
<head>
    <title>Change Font Size</title>
</head>
<body>

    <p id="para">This is a sample paragraph.</p>

    <input type="radio" name="size" onclick="changeSize('16px')"> Small <br>
    <input type="radio" name="size" onclick="changeSize('24px')"> Medium <br>
    <input type="radio" name="size" onclick="changeSize('32px')"> Large

    <script>
        function changeSize(size) {
            document.getElementById("para").style.fontSize = size;
        }
    </script>

</body>
</html>
