<!DOCTYPE html>
<html>
    <head>
       <body>
    <h1>JavaScript Arrays</h1>
    <h2>The concat() method</h2>

    <p>The concat() method merges(concatenates) an array:</p>

    <p id ="demo"></p>
    

    <script>
        const first = ["Hari", "Shyam"];
         const second = ["Ram", "Oshin","Ava"];
          const third = first.concat(second);
        document.getElementById("demo").innerHTML = third;
       

        </script>
    </body>
    </html>
