<!DOCTYPE html>
<html>

       <body>
    <h1>JavaScript Arrays</h1>
    <h2>The pop() and push() method</h2>

    <p>The pop() method removes the last element from an array:</p>
     <p>The push() method adds the last element to an array:</p>
 <p>The shift() method removes the first element from an array:</p>
  <p>The unshift() method adds the new element o the beginning of an array:</p>
    <p id ="demo1"></p>
     <p id ="demo2"></p>
     <p id ="demo3"></p>
     <p id ="demo4"></p>
     <p id ="demo5"></p>

    <script>
        const fruits = [ "Banana", "Orange", "Apple", "Mango", "Strawberry"];
        document.getElementById("demo1").innerHTML = fruits;
        fruits.pop();
        document.getElementById("demo2").innerHTML = fruits;
        fruits.push("kiwi");
         document.getElementById("demo3").innerHTML = fruits;
         fruits.shift();
          document.getElementById("demo4").innerHTML = fruits;
          fruits.unshift("lemon");
          document.getElementById("demo5").innerHTML = fruits;

        </script>
    </body>
    </html>
